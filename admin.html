    <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elimupeo Admin</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px;max-width:600px;margin:0 auto}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.05);margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
button{background:#0a7a42;color:white;border:none;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}
button:disabled{background:#94a3b8}
.success{background:#dcfce7;color:#166534;padding:12px;border-radius:8px;margin-top:10px;display:none}
</style>
</head>
<body>
<h2 style="color:#0a7a42">ELIMUPEO Admin 🔐</h2>
<p style="font-size:13px;color:#64748b">Add new opportunity. It will appear on elimupeo.vercel.app</p>

<div class="card">
<input id="title" placeholder="Title e.g. HELB Undergraduate">
<textarea id="desc" placeholder="Description"></textarea>
<input id="deadline" type="text" placeholder="Deadline e.g. 30 Sep 2025">
<select id="type"><option>Government</option><option>International</option><option>Foundation</option><option>Regional</option></select>
<input id="link" placeholder="Apply Link https://...">
<button id="btn" onclick="addOpp()">Save to Website</button>
<div id="msg" class="success"></div>
</div>

<div class="card">
<h4>Current Opportunities in Database</h4>
<div id="list" style="font-size:13px">Loading...</div>
<button onclick="loadData()" style="background:#334155;margin-top:10px">Refresh List</button>
</div>

<script>
const SUPABASE_URL = "https://wqhbenevvvfpkvaesgga.supabase.co";
const SUPABASE_KEY = "sb_publishable_TP2JoWT1hZpS-z52uTMyDw_v8y5b3Y0";

async function addOpp(){
const btn=document.getElementById('btn'); btn.disabled=true; btn.innerText="Saving...";
const payload={
title: document.getElementById('title').value,
description: document.getElementById('desc').value,
deadline: document.getElementById('deadline').value,
type: document.getElementById('type').value,
link: document.getElementById('link').value
};
try{
const res = await fetch(`${SUPABASE_URL}/rest/v1/opportunities`,{
method:"POST",
headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"},
body: JSON.stringify(payload)
});
if(!res.ok) throw new Error(await res.text());
document.getElementById('msg').style.display='block';
document.getElementById('msg').innerText='✅ Saved! Now go to elimupeo.vercel.app and you will see it after we connect homepage to Supabase in next step.';
btn.innerText="Saved!"; loadData();
}catch(e){
alert("Error: "+e.message+"\n\nMake sure RLS is still disabled in Supabase.");
btn.disabled=false; btn.innerText="Save to Website";
}
}

async function loadData(){
try{
const res = await fetch(`${SUPABASE_URL}/rest/v1/opportunities?select=*&order=created_at.desc`,{headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`}});
const data = await res.json();
document.getElementById('list').innerHTML = data.map(o=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${o.title}</b><br><small>${o.type} - ${o.deadline}</small></div>`).join('') || 'No data yet';
}catch(e){document.getElementById('list').innerText='Error loading: '+e.message}
}
loadData();
</script>
</body>
</html>
