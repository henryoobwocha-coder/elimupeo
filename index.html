<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elimupeo | Kenya's #1 Opportunity Hub</title><link rel="icon" href="logo.jpg">
<style>:root{--green:#0a1f14;--light:#123722;--brand:#00a651;--yellow:#f9d878}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--green);color:white}.topbar{background:var(--yellow);color:#000;text-align:center;padding:9px;font-weight:bold;font-size:13px}.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;max-width:1100px;margin:auto}.nav img{height:42px;border-radius:8px;background:#fff;padding:2px}.hero{max-width:1100px;margin:auto;padding:30px 20px;text-align:center}.btn{padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:bold;display:inline-block}.btn-y{background:var(--yellow);color:#000}.btn-g{background:var(--brand);color:#fff;padding:8px 14px;font-size:12px}.search{max-width:500px;margin:15px auto;display:block;width:90%;padding:14px;border-radius:10px;border:1px solid #2a5a3a;background:var(--light);color:white;text-align:center}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;padding:20px}.card{background:var(--light);border:1px solid #1e4a2e;border-radius:14px;padding:18px}.footer{text-align:center;padding:30px;opacity:.6;font-size:12px}</style></head>
<body>
<div class="topbar">🇰🇪 Kenya's #1 Opportunity Hub | Nyamira to 47 Counties</div>
<div class="nav"><div style="display:flex;align-items:center;gap:10px"><img src="logo.jpg"><b>ELIMUPEO.co.ke</b></div><div style="color:var(--yellow);font-size:13px">Home • Gov • International</div></div>
<div class="hero"><h1>Find Your Next <span style="color:var(--yellow)">Opportunity</span></h1><p style="color:var(--yellow)">✅ 10 Live Opportunities - No Sheet, No Bug</p><input id="q" class="search" placeholder="🔍 Search Equity, HELB, Nyamira, Kisii..." oninput="filter()"><p><a href="https://wa.me/254716840822?text=ALERTS" class="btn btn-y">📲 Text 'ALERTS' to 0716840822</a></p></div>
<div id="grid" class="grid"></div>
<div class="footer">Base: Nyamira • © 2026 Elimupeo.co.ke</div>
<script>
const jobs=[
{type:"Government",county:"All 47",title:"Elimu Scholarship 2026 - Ministry of Education",desc:"For needy KCPE students joining Form 1. Apply via Equity Bank.",link:"https://education.go.ke"},
{type:"Foundation",county:"All 47",title:"Equity Wings to Fly 2026",desc:"Full secondary scholarship for top KCPE performers.",link:"https://equitygroupfoundation.com"},
{type:"Attachment",county:"All 47",title:"Communications Authority Attachment Oct-Dec",desc:"17 departments, 3 months. For continuing students.",link:"#"},
{type:"Government",county:"Nationwide",title:"PSC Internship 2026",desc:"12-month government internship for graduates.",link:"https://publicservice.go.ke"},
{type:"Loan",county:"All 47",title:"HELB Loan 2026/2027",desc:"First time and subsequent loans for University & TVET.",link:"https://helb.co.ke"},
{type:"Foundation",county:"Nairobi/Kisii/Nyamira",title:"KCB 2Jiajiri Scholarship",desc:"TVET scholarship for youth.",link:"https://kcbgroup.com"},
{type:"International",county:"All 47",title:"DAAD Germany Scholarships",desc:"Masters for Kenyans in Germany.",link:"https://daad.or.ke"},
{type:"International",county:"TVET & Uni",title:"Mastercard Foundation Scholarship",desc:"Full scholarship at partner universities.",link:"https://mastercardfdn.org"},
{type:"Jobs",county:"Nairobi",title:"Safaricom, KENGEN, KPLC Attachment",desc:"Industrial attachment slots open.",link:"#"},
{type:"Grant",county:"Remote",title:"Ajira Digital Training - Ministry of ICT",desc:"Free online work skills for youth.",link:"https://ajiradigital.go.ke"}
];
function render(list){document.getElementById('grid').innerHTML=list.map(j=>`<div class="card"><small>${j.type} • ${j.county}</small><h3>${j.title}</h3><p style="opacity:.8;font-size:14px">${j.desc}</p><a class="btn btn-g" href="${j.link}" target="_blank">Apply</a></div>`).join('')}
function filter(){let q=document.getElementById('q').value.toLowerCase();render(jobs.filter(j=>(j.title+j.county).toLowerCase().includes(q)))}
render(jobs);
</script></body></html>
