<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elimuPeo.co.ke - Find Your Next Opportunity</title>
<link rel="icon" href="logo.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI}
body{background:#fdf6e3;background:linear-gradient(180deg,#fef9e7 0%, #fde9b8 100%);min-height:100vh;color:#1f2937}
nav{max-width:1200px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
nav .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
nav .logo img{width:36px;height:36px;border-radius:8px;background:#fff;border:1px solid #e7d7b0;object-fit:contain}
nav .links{font-size:13px;color:#6b7280;display:flex;gap:16px}
.hero{text-align:center;padding:38px 16px 18px}
.hero h1{font-size:36px;font-weight:800;color:#1f2937;line-height:1.2}
.hero h1 span{color:#a16207}
.hero p{margin-top:8px;color:#78716c;font-size:14px}
.search-wrap{max-width:560px;margin:18px auto 0;background:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;border:1px solid #f1e0b0;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.search-wrap input{flex:1;border:0;outline:0;font-size:14px}
.grid{max-width:1200px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#ffffffd9;backdrop-filter:blur(4px);border:1px solid #f1e0b0;border-radius:14px;padding:16px;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:14px;line-height:1.4;margin-bottom:8px;font-weight:700;min-height:38px}
.badge{display:inline-block;font-size:10px;padding:4px 8px;border-radius:999px;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.badge.attach{background:#dcfce7;color:#166534}
.badge.intern{background:#dbeafe;color:#1e40af}
.badge.scholar{background:#fef9c3;color:#854d0e}
.badge.job{background:#fee2e2;color:#991b1b}
.meta{font-size:11px;color:#57534e;display:flex;gap:10px;margin-bottom:8px}
.desc{font-size:12px;color:#57534e;line-height:1.5;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.dead{font-size:11px;color:#92400e;font-weight:600}
.btn{background:#16a34a;color:#fff;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700}
footer{text-align:center;padding:28px;color:#a8a29e;font-size:11px}
</style>
</head>
<body>
<nav>
<div class="logo"><img src="logo.jpg" alt=""> elimuPeo.co.ke</div>
<div class="links"><span>Home</span><span>Gov</span><span>Privacy</span></div>
</nav>
<div class="hero">
<h1>Find Your Next <span>Opportunity</span></h1>
<p id="sub">10 Live Opportunities - Verified Daily</p>
<div class="search-wrap"><span>🔍</span><input id="q" placeholder="Search Equity, HELB, Nyandarua, Biashara"></div>
</div>
<div class="grid" id="grid"></div>
<footer>© 2026 elimuPeo.co.ke - Kenya's Trusted Hub</footer>
<script>
const jobs=[
{title:"Communications Authority CA Attachment Oct-Dec 2026",type:"Attachment",county:"All 47 Counties",deadline:"Sep 18, 2026",desc:"17 departments: IT, Law, Finance, Engineering, Media. 3-month attachment for ongoing students.",link:"https://forms.gle/SNYBcx1UhtdRxG8d6",badge:"attach"},
{title:"KEMRI Administrative Interns - 3 Positions Kisumu",type:"Internship",county:"Kisumu",deadline:"Sep 30, 2026",desc:"Youth below 30, Business Admin degree. 12 months at KEMRI CDC Kisumu.",link:"https://www.kemri.go.ke",badge:"intern"},
{title:"Kenya School of Government Attachment Nairobi",type:"Attachment",county:"Nairobi",deadline:"Sep 25, 2026",desc:"Public admin, HR, ICT students. Apply via KSG portal.",link:"#",badge:"attach"},
{title:"Equity Bank Wings to Fly Scholarship 2026",type:"Scholarship",county:"All 47 Counties",deadline:"Oct 05, 2026",desc:"For KCPE 2025 needy & bright. Full scholarship Form 1.",link:"#",badge:"scholar"},
{title:"Public Service Commission Internship",type:"Internship",county:"Nairobi",deadline:"Sep 20, 2026",desc:"Government 12-month internship for diploma & degree graduates.",link:"#",badge:"intern"},
{title:"HELB Loan Application 2025/2026",type:"Scholarship",county:"All 47 Counties",deadline:"Oct 31, 2026",desc:"First time & subsequent HELB loans for TVET and University.",link:"https://portal.helb.co.ke",badge:"scholar"},
{title:"KCB Foundation 2Jiajiri Scholarship",type:"Scholarship",county:"Nairobi, Mombasa",deadline:"Sep 28, 2026",desc:"Vocational training for youth in plumbing, electrical, beauty.",link:"#",badge:"scholar"},
{title:"Ministry of ICT Ajira Digital Training",type:"Attachment",county:"Remote",deadline:"Open",desc:"Free online work skills training for youth. All counties.",link:"https://ajiradigital.go.ke",badge:"attach"},
{title:"County Government of Nyandarua Internship",type:"Internship",county:"Nyandarua",deadline:"Sep 22, 2026",desc:"County internship for 100 graduates across departments.",link:"#",badge:"intern"},
{title:"Kenyatta National Hospital Attachment",type:"Attachment",county:"Nairobi",deadline:"Sep 30, 2026",desc:"Medical & admin attachment for KMTC & university students.",link:"#",badge:"attach"}
];
function render(){
 const q=document.getElementById("q").value.toLowerCase();
 const filtered=jobs.filter(j=>(j.title+j.county+j.type).toLowerCase().includes(q));
 document.getElementById("sub").textContent=filtered.length+" Live Opportunities - Verified Daily";
 document.getElementById("grid").innerHTML=filtered.map(j=>`
  <div class="card">
   <span class="badge ${j.badge}">${j.type}</span>
   <h3>${j.title}</h3>
   <div class="meta"><span>📍 ${j.county}</span><span>⏰ ${j.deadline}</span></div>
   <div class="desc">${j.desc}</div>
   <div class="foot"><span class="dead">${j.deadline}</span><a class="btn" href="${j.link}" target="_blank">Apply</a></div>
  </div>
 `).join("");
}
document.getElementById("q").addEventListener("input",render);
render();
</script>
</body>
</html>
