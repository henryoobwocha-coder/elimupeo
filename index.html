<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elimuPeo.co.ke</title>
<link rel="icon" href="logo.jpg">
<style>
body{margin:0;font-family:system-ui;background:#f6f8f9;color:#101828}
header{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
header img{width:45px;height:45px;border-radius:8px;border:1px solid #e2e8f0}
.wrap{max-width:900px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.card h3{font-size:15px;margin:0 0 6px}
.small{font-size:12px;color:#64748b}
.btn{background:#0b7a3d;color:#fff;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>
<img src="logo.jpg" alt="logo">
<div><b>elimuPeo.co.ke</b><div class="small">Verified Opportunities Kenya</div></div>
</header>
<div class="wrap" id="jobs"></div>
<footer>© 2026 elimuPeo.co.ke — Verified opportunities</footer>
<script>
const jobs=[
{title:"Communications Authority CA Attachment Oct-Dec 2026",type:"Attachment",county:"All 47 Counties",deadline:"2026-09-18",desc:"17 departments IT Law Finance Engineering Media 3-month attachment",link:"https://forms.gle/SNYBcx1UhtdRxG8d6"},
{title:"KEMRI Administrative Interns - 3 Positions",type:"Internship",county:"Kisumu",deadline:"2026-09-30",desc:"Youth below 30 Business Admin degree 3 slots",link:"https://www.kemri.go.ke"},
{title:"Kenya School of Government Attachment",type:"Attachment",county:"Nairobi",deadline:"2026-09-25",desc:"Public administration students",link:"#"},
{title:"Equity Bank Wings to Fly Scholarship",type:"Scholarship",county:"All 47 Counties",deadline:"2026-10-05",desc:"KCPE 2025 needy bright students",link:"#"},
{title:"PSC Internship Program",type:"Internship",county:"Nairobi",deadline:"2026-09-20",desc:"Government internship 12 months",link:"#"}
];
document.getElementById("jobs").innerHTML=jobs.map(j=>`<div class="card"><div><h3>${j.title}</h3><div class="small">${j.type} • ${j.county} • ⏰ ${j.deadline}</div><div class="small" style="margin-top:6px">${j.desc}</div></div><a class="btn" href="${j.link}" target="_blank">Apply</a></div>`).join("");
</script>
</body>
</html>
