<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elimuPeo.co.ke — Education Opportunities Kenya</title>
<meta name="description" content="Verified Scholarships, Internships, Attachments and Jobs in Kenya — Updated Daily">
<link rel="icon" href="logo.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,Roboto,sans-serif}
body{background:#f8fafc;color:#0f172a;line-height:1.6}
header{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:14px 18px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid #e2e8f0}
.brand h1{font-size:18px;font-weight:800}
.brand h1 span{color:#2563eb}
.filter{padding:8px 14px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;font-size:13px;cursor:pointer}
.filter.active{background:#0f172a;color:#fff}
.container{max-width:1100px;margin:0 auto;padding:18px}
.search-wrap{display:flex;gap:10px;margin:18px 0}
.search-wrap input{flex:1;padding:14px 16px;border-radius:12px;border:1px solid #e2e8f0;font-size:14px}
.hero{background:linear-gradient(135deg,#0f172a 0%,#1e40af 100%);color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,0.06)}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.badge.scholarship{background:#dcfce7;color:#166534}
.badge.internship{background:#dbeafe;color:#1e40af}
.badge.attachment{background:#fef9c3;color:#854d0e}
.badge.job{background:#fee2e2;color:#991b1b}
.county{font-size:12px;color:#64748b;background:#f1f5f9;padding:4px 8px;border-radius:999px}
.card-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.deadline{font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;padding:4px 8px;border-radius:999px}
.apply{font-size:13px;font-weight:700;color:#fff;background:#2563eb;padding:8px 14px;border-radius:999px;text-decoration:none}
footer{text-align:center;padding:28px;color:#64748b;font-size:12px;border-top:1px solid #e2e8f0;margin-top:30px;background:#fff}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.jpg" alt="elimuPeo logo">
    <h1>elimuPeo<span>.co.ke</span></h1>
  </div>
  <nav id="typeFilters">
    <button class="filter active" data-type="all">All</button>
    <button class="filter" data-type="Scholarship">Scholarships</button>
    <button class="filter" data-type="Internship">Internships</button>
    <button class="filter" data-type="Attachment">Attachment</button>
    <button class="filter" data-type="Job">Jobs</button>
  </nav>
</header>
<div class="container">
  <div class="hero">
    <div><h2>Verified Education Opportunities in Kenya</h2><p>Scholarships • Internships • Attachments • Jobs — Updated daily.</p></div>
    <div id="countBadge">Loading...</div>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search title, county...">
    <select id="countyFilter" class="filter"><option value="all">All Counties</option><option value="Nairobi">Nairobi</option><option value="Kisumu">Kisumu</option><option value="All 47 Counties">All 47</option></select>
  </div>
  <div id="grid" class="grid"></div>
</div>
<footer>© 2026 elimuPeo.co.ke — Verified Education Opportunities Kenya<br>Verified • No fees charged</footer>
<script>
// REPLACE THIS with your Sheet publish link
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/YOUR_PUBLISHED_ID/pub?gid=0&single=true&output=csv";
let allData=[],currentType="all";
function parseCSV(t){const rows=[];let cur=[],val="",inQ=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c=='"'){if(inQ&&n=='"'){val+='"';i++;}else inQ=!inQ;}else if(c==','&&!inQ){cur.push(val.trim());val="";}else if((c=='\n'||c=='\r')&&!inQ){if(val||cur.length){cur.push(val.trim());rows.push(cur);cur=[];val="";}if(c=='\r'&&n=='\n')i++;}else val+=c;}if(val||cur.length){cur.push(val.trim());rows.push(cur);}return rows;}
async function load(){const r=await fetch(CSV_URL+"&t="+Date.now());const txt=await r.text();const rows=parseCSV(txt);const h=rows[0].map(x=>x.toLowerCase());const idx={title:h.indexOf("title"),description:h.indexOf("description"),deadline:h.indexOf("deadline"),type:h.indexOf("type"),link:h.indexOf("link"),county:h.indexOf("county")};allData=rows.slice(1).map(rr=>({title:rr[idx.title],description:rr[idx.description],deadline:rr[idx.deadline],type:rr[idx.type],link:rr[idx.link],county:rr[idx.county]})).filter(o=>o.title);render();}
function render(){const q=document.getElementById("searchInput").value.toLowerCase();const cf=document.getElementById("countyFilter").value;let f=allData.filter(o=>{return (currentType=="all"||o.type.toLowerCase()==currentType.toLowerCase()) && (!q||(o.title+o.description+o.county).toLowerCase().includes(q)) && (cf=="all"||o.county.toLowerCase().includes(cf.toLowerCase()));});f.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));document.getElementById("countBadge").textContent=f.length+" Active";document.getElementById("grid").innerHTML=f.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span class="badge ${o.type.toLowerCase()}">${o.type}</span><span class="county">${o.county}</span></div><h3>${o.title}</h3><p>${o.description}</p><div class="card-footer"><span class="deadline">⏰ ${o.deadline||"Ongoing"}</span><a class="apply" href="${o.link}" target="_blank">Apply →</a></div></div>`).join("");}
document.querySelectorAll("#typeFilters.filter").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll("#typeFilters.filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentType=b.dataset.type;render();});});
document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("countyFilter").addEventListener("change",render);
load();
</script>
</body>
</html>
